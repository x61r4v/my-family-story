<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Storytelling panel — concepts</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Newsreader:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root{
  --paper:#F4EFE4; --canvas:#EBE4D4; --canvas-dot:#D8CEB8;
  --surface:#FFFDF7; --surface-2:#FAF5EA; --surface-3:#F2EADb;
  --ink:#26211A; --ink-2:#6B6256; --ink-3:#9A9082;
  --line:#E4DBC8; --line-2:#D6CBB3; --line-3:#C4B89C;
  --blue:#0C66E4; --blue-h:#0055CC; --blue-subtle:#E9F2FF; --blue-border:#9FC1F5;
  --amber:#B07D2B; --amber-d:#8A6017; --amber-subtle:#F6ECD6;
  --plum:#6E5DC6; --plum-subtle:#EDE9FA;
  --sex-m:#5E83B3; --sex-f:#B5756A; --living:#2F8A5B;
  --loss:#9A5B3F;
  --shadow-node:0 1px 2px rgba(38,33,26,.10), 0 2px 6px rgba(38,33,26,.06);
  --shadow-pop:0 8px 28px rgba(38,33,26,.16), 0 2px 8px rgba(38,33,26,.08);
  --font-ui:'Inter',system-ui,-apple-system,sans-serif;
  --font-body:'Roboto',system-ui,sans-serif;
  --font-serif:'Newsreader',Georgia,serif;
  --font-he:'Frank Ruhl Libre',serif;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{font-family:var(--font-body); color:var(--ink); background:var(--paper); -webkit-font-smoothing:antialiased;}
a{color:var(--blue);} a:hover{color:var(--blue-h);}
#root{min-height:100vh;}
::selection{background:rgba(12,102,228,.18);}
*::-webkit-scrollbar{width:9px;height:9px;}
*::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px;border:2px solid transparent;background-clip:content-box;}
*::-webkit-scrollbar-track{background:transparent;}

/* ---- page ---- */
.sc-page{ min-height:100vh; padding:22px 22px 128px; background:
  radial-gradient(var(--canvas-dot) 1.1px, transparent 1.1px) 0 0/24px 24px, var(--paper); }
.sc-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:24px; flex-wrap:wrap; margin-bottom:22px; }
.sc-title h1{ font-family:var(--font-serif); font-weight:600; font-size:29px; letter-spacing:-.4px; margin:0 0 6px; color:var(--ink); }
.sc-title p{ margin:0; font-family:var(--font-ui); font-size:13.5px; color:var(--ink-2); max-width:640px; line-height:1.5; }
.sc-pick{ display:flex; flex-direction:column; gap:7px; }
.sc-pick-lbl{ font-family:var(--font-ui); font-weight:700; font-size:10.5px; letter-spacing:.7px; text-transform:uppercase; color:var(--ink-3); }
.sc-pick-row{ display:flex; gap:6px; flex-wrap:wrap; max-width:340px; }
.sc-chip{ border:1px solid var(--line-2); background:var(--surface); color:var(--ink-2); border-radius:9999px;
  padding:6px 13px; font-family:var(--font-ui); font-weight:600; font-size:12.5px; cursor:pointer; transition:.15s; }
.sc-chip:hover{ background:var(--surface-2); color:var(--ink); }
.sc-chip.on{ background:var(--ink); border-color:var(--ink); color:#fff; }

/* ---- three columns ---- */
.sc-cols{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; align-items:start; }
@media (max-width:520px){ .sc-cols{ grid-template-columns:1fr; max-width:460px; margin:0 auto; } }
.sc-col-h{ display:flex; gap:11px; align-items:flex-start; margin-bottom:11px; min-height:52px; }
.sc-badge{ flex:0 0 auto; width:26px; height:26px; border-radius:8px; background:var(--amber-subtle); color:var(--amber-d);
  font-family:var(--font-ui); font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; }
.sc-col-name{ font-family:var(--font-serif); font-weight:600; font-size:19px; color:var(--ink); line-height:1.15; }
.sc-col-desc{ font-family:var(--font-ui); font-size:11.5px; color:var(--ink-2); line-height:1.45; margin-top:2px; }
.sc-panel{ background:var(--surface); border:1px solid var(--line-2); border-radius:18px; box-shadow:var(--shadow-pop); overflow:hidden; }
.sc-body{ height:70vh; max-height:660px; overflow-y:auto; }

/* ============ CONCEPT B — standing ============ */
.standing{ overflow-y:auto; }
.st-hero{ position:relative; height:230px; background:var(--surface-3); }
.st-photo{ width:100%; height:100%; object-fit:cover; display:block; }
.st-photo.ph{ display:flex; align-items:center; justify-content:center; font-family:var(--font-serif); font-size:52px; color:var(--ink-3); background:var(--surface-2); }
.st-scrim{ position:absolute; inset:0; background:linear-gradient(to top, rgba(20,16,10,.82) 0%, rgba(20,16,10,.15) 46%, transparent 70%); }
.st-scrim.pre{ background:linear-gradient(to top, rgba(20,16,10,.82) 0%, rgba(30,24,16,.4) 55%, rgba(60,50,36,.25) 100%); filter:sepia(.35); }
.st-head{ position:absolute; left:20px; bottom:15px; right:20px; color:#fff; }
.st-big{ font-family:var(--font-serif); font-weight:600; font-size:34px; line-height:1; letter-spacing:-.5px; }
.st-sub{ font-family:var(--font-ui); font-size:13px; opacity:.9; margin-top:5px; }
.st-now{ padding:16px 20px 4px; }
.st-lead{ font-family:var(--font-serif); font-size:19px; line-height:1.35; color:var(--ink); margin:0; }
.st-sec{ padding:14px 20px 4px; }
.st-sec-h{ font-family:var(--font-ui); font-weight:700; font-size:10.5px; letter-spacing:.7px; text-transform:uppercase; color:var(--ink-3); margin-bottom:9px; }
.st-sec-h.loss{ color:var(--loss); }
.st-people{ display:flex; flex-direction:column; gap:8px; }
.st-person{ display:flex; align-items:center; gap:9px; font-family:var(--font-ui); font-size:14px; color:var(--ink); }
.st-dot{ width:9px; height:9px; border-radius:50%; flex:0 0 auto; }
.st-rel{ color:var(--ink-2); font-size:12.5px; }
.st-mini{ display:flex; gap:11px; font-family:var(--font-ui); font-size:13.5px; color:var(--ink); padding:4px 0; }
.st-yr{ flex:0 0 auto; color:var(--amber-d); font-weight:600; font-variant-numeric:tabular-nums; }
.standing .st-sec:last-child{ padding-bottom:18px; }

/* ============ CONCEPT A — diary ============ */
.diary{ padding:6px 0 20px; }
.dy-chapter{ font-family:var(--font-ui); font-weight:700; font-size:10.5px; letter-spacing:.7px; text-transform:uppercase; color:var(--ink-3); padding:16px 22px 8px; }
.dy-chapter.pre{ color:var(--amber-d); }
.dy-birth{ display:flex; align-items:center; justify-content:center; margin:8px 22px 10px; }
.dy-birth span{ font-family:var(--font-serif); font-style:italic; font-size:14px; color:var(--amber-d);
  background:var(--amber-subtle); border-radius:9999px; padding:5px 16px; }
.dy-row{ display:grid; grid-template-columns:34px 1fr; padding:0 20px; }
.dy-rail{ display:flex; justify-content:center; position:relative; }
.dy-rail::before{ content:''; position:absolute; top:0; bottom:0; width:2px; background:var(--line); }
.dy-node{ width:9px; height:9px; border-radius:50%; background:var(--line-3); margin-top:16px; z-index:1; box-shadow:0 0 0 3px var(--surface); }
.dy-row.self .dy-node{ background:var(--amber); }
.dy-row.active .dy-node{ background:var(--blue); box-shadow:0 0 0 3px var(--surface), 0 0 0 6px var(--blue-subtle); }
.dy-card{ padding:9px 0 13px 4px; }
.dy-yr{ font-family:var(--font-ui); font-weight:600; font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
.dy-text{ font-family:var(--font-serif); font-size:16px; line-height:1.35; color:var(--ink); margin-top:2px; }
.dy-row.self .dy-text{ font-weight:500; }
.dy-row.world .dy-card, .dy-row.world .dy-text{ color:var(--ink-2); }
.dy-row.world .dy-text{ font-style:italic; }
.dy-row.future{ opacity:.4; }
.dy-post{ font-family:var(--font-body); font-size:13px; line-height:1.5; color:var(--ink-2); margin-top:6px; }
.dy-photo{ width:100%; border-radius:11px; margin-top:10px; display:block; box-shadow:var(--shadow-node); }
.dy-row.active .dy-card{ background:var(--surface-2); border-radius:12px; padding:11px 12px 14px; margin-left:-6px; }

/* ============ CONCEPT C — two rivers ============ */
.rivers{ padding:0 0 20px; }
.rv-head{ display:flex; justify-content:space-between; position:sticky; top:0; z-index:2; background:var(--surface);
  padding:13px 16px; border-bottom:1px solid var(--line); font-family:var(--font-ui); font-weight:700;
  font-size:10.5px; letter-spacing:.6px; text-transform:uppercase; color:var(--ink-3); }
.rv-head .rv-you{ color:var(--amber-d); }
.rv-row{ display:grid; grid-template-columns:1fr 46px 1fr; align-items:center; gap:4px; padding:5px 12px; min-height:44px; }
.rv-row.future{ opacity:.4; }
.rv-axis{ display:flex; flex-direction:column; align-items:center; position:relative; align-self:stretch; justify-content:center; }
.rv-axis::before{ content:''; position:absolute; top:0; bottom:0; width:2px; background:var(--line); }
.rv-yr{ font-family:var(--font-ui); font-weight:600; font-size:10px; color:var(--ink-3); background:var(--surface); z-index:1; padding:1px 0; font-variant-numeric:tabular-nums; }
.rv-node{ width:8px; height:8px; border-radius:50%; background:var(--line-3); z-index:1; box-shadow:0 0 0 3px var(--surface); }
.rv-row.active .rv-node{ background:var(--blue); box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--blue-subtle); }
.rv-card{ border-radius:11px; padding:8px 11px; font-family:var(--font-serif); font-size:14px; line-height:1.3; }
.rv-card.fam{ background:var(--surface-3); color:var(--ink); }
.rv-card.you{ background:var(--amber-subtle); color:var(--ink); }
.rv-post{ font-family:var(--font-body); font-size:12px; color:var(--ink-2); line-height:1.45; margin-top:5px; }
.rv-photo{ width:100%; border-radius:9px; margin-top:8px; display:block; }
.rv-right{ display:flex; justify-content:flex-start; }
.rv-left{ display:flex; justify-content:flex-end; text-align:right; }
.rv-left .rv-card{ text-align:left; }
.rv-dot{ font-family:var(--font-ui); font-size:11px; font-style:italic; color:var(--ink-3); }
.rv-row.active .rv-card.you{ box-shadow:var(--shadow-node); }

/* ---- shared scrubber ---- */
.sc-scrub{ position:fixed; left:50%; transform:translateX(-50%); bottom:20px; z-index:40;
  width:min(760px,calc(100vw - 48px)); background:var(--surface); border:1px solid var(--line-2);
  border-radius:9999px; box-shadow:var(--shadow-pop); padding:13px 26px 11px; display:flex; align-items:center; gap:18px; }
.sc-year{ font-family:var(--font-serif); font-weight:600; font-size:23px; color:var(--ink); min-width:66px; font-variant-numeric:tabular-nums; }
.sc-year{ white-space:nowrap; }
.sc-scrub input[type=range]{ flex:1; accent-color:var(--blue); height:4px; }
.sc-ends{ display:none; }
@media (min-width:720px){ .sc-ends{ display:flex; gap:8px; font-family:var(--font-ui); font-size:11px; color:var(--ink-3); } }

/* thumbnail splash for bundling */
</style>
<template id="__bundler_thumbnail">
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="#EBE4D4"/><g transform="translate(30,26)"><rect x="0" y="0" width="40" height="48" rx="6" fill="#FFFDF7" stroke="#B07D2B" stroke-width="2"/><circle cx="20" cy="15" r="8" fill="#B5756A"/><rect x="8" y="28" width="24" height="3" rx="1.5" fill="#D6CBB3"/><rect x="8" y="35" width="18" height="3" rx="1.5" fill="#D6CBB3"/></g></svg>
</template>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="tree-seed.js"></script>
<script src="family-data.js"></script>
<script src="relationships.js"></script>
<script type="text/babel" src="story-concepts.jsx"></script>
</body>
</html>
